<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Como está o céu hoje?</h1>

        <div="container">

        <input type="text" id="campo-texto" placeholder="Buscar um local...">

        <button id="botao">Buscar</button>

        </div>

    </header>

    <main>

        <section>
            <div class="cartao">

            <div id="local">
                <p>Porto Alegre BR</p>
                <P>14 de novembro de 2026</P>
            </div>

            <div id="inf">
                <img src="assets/icon-sunny.webp" alt="tempo">
                <span id="temperatura">25</span>°C
            </div>

        </div>

            <div class="condicoes">
                <div>
                    <p>Sensação térmica</p>
                    <p><span id="sensacao-termica">20</span>°C</p>
                </div>

                <div>
                    <p>Umidade</p>
                    <p><span id="umidade">58</span>%</p>
                </div>

                <div>
                    <p>Vento</p>
                    <p id="vento">11,8 km/h</p>
                </div>

                <div>
                    <p>Precipitação</p>
                    <p id="precipitacao">0 mm</p>
                </div>

            </div>

        </section>

        <section>

            <h2>Previsão Diária</h2>
            <div id="previsao-dias">

             <div class="cartao-dia">
                <div class="dia-semana">Ter.</div>
                <div class="img-clima">
                    <img src="assets/icon-partly-cloudy.webp" alt="nublado">
                </div>
                
                <div class="temperatura">
                    <span class="temperatura-maxima">15°C</span>
                    <span class="temperatura-minima">4°C</span>
                </div>
                </div>  

                <div class="cartao-dia">
                <div class="dia-semana">Qua.</div>
                <div class="img-clima">
                    <img src="assets/icon-sunny.webp" alt="ensolarado">
                </div>
                
                <div class="temperatura">
                    <span class="temperatura-maxima">21°C</span>
                    <span class="temperatura-minima">16°C</span>
                </div>

                </div>
            </div>

        </section>

        <section>

            <div class="previsao-dia">
            <h2>Previsão por hora</h2>

            <select name="Dia" id="selecao-dia">
                <option value="dom">Domingo</option>
                <option value="seg">segunda-feira</option>
                <option value="ter">Terça-feira</option>
                <option value="qua">Quarta-feira</option>
                <option value="qui">Quinta-feira</option>
                <option value="sex">Sexta-feira</option>
                <option value="sab">Sábado</option>
            </select>

            </div>

            <div id="previsao-horario">
                <div class="hora-item">

                <div class="img-clima">
                    <img src="assets/icon-rain.webp" alt="chuva">
                </div>
                
                <div class="hora">14:00</div>
                
                <div class="temperatura">
                    <span class="valor-temperatura">15°C</span>
                </div>
                </div>

                <div class="hora-item">

                <div class="img-clima">
                 <img src="assets/icon-rain.webp" alt="chuva">
                 </div>
               
                
                <div class="hora">15:00</div>
                
                
                <div class="temperatura">
                    <span class="valor-temperatura">17°C</span>
                </div> 
                </div>
            </div>
        </section>
        
    </main>
    

    <script src="script.js"></script>
</body>
</html>
